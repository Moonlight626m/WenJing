services:
  db:
    image: postgres:16-alpine
    container_name: wenjing-db
    environment:
      POSTGRES_USER: wenjing
      POSTGRES_PASSWORD: wenjing
      POSTGRES_DB: wenjing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wenjing"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
