[project]
name = "wenjing-backend"
version = "0.1.0"
description = "文境 (Wenjing) backend — 语文课文情景演绎 multi-agent 平台"
readme = "README.md"
authors = [
    { name = "moonlight", email = "10245101492@ecnu.edu.cn" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.14",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary]>=3.2",
    "openai>=1.50",
    "httpx>=0.27",
    "websockets>=13",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "import-linter>=2.15",
]

[project.scripts]
wenjing-backend = "app.main:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
